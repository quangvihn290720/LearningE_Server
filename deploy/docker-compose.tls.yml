# Triển khai thật: Caddy đứng trước edge, tự xin và gia hạn chứng chỉ TLS. Cần tên miền trỏ về máy và mở cổng 80, 443.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml up --build -d --wait
# Máy 2 GB RAM: thay tệp đầu bằng deploy/docker-compose.small.yml.
services:
  edge:
    ports: !reset []                 # không còn cổng nào của edge trên máy chủ, chỉ Caddy gọi được
    environment:
      EDGE_TRUST_PROXY: "true"
      EDGE_CLIENT_IP_HEADER: x-forwarded-for

  caddy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:?đặt tên miền trong deploy/.env}
      CADDY_TLS: ${CADDY_TLS:-}      # "tls internal" để thử trên máy cá nhân
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data             # chứng chỉ và khóa: giữ lại giữa các lần dựng
      - caddy-config:/config
    networks: [public]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    depends_on:
      edge: { condition: service_healthy }

volumes:
  caddy-data: {}
  caddy-config: {}

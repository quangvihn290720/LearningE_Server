name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Testcontainers dùng Docker có sẵn trên runner để chạy MongoDB thật.
      - run: ./gradlew build jacocoTestReport
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: |
            */build/reports/tests
            */build/reports/jacoco

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash deploy/gen-env.sh
      - run: docker compose -f deploy/docker-compose.yml up --build -d --wait --wait-timeout 300
      - name: Chỉ edge được publish, và chỉ trên loopback
        run: |
          published=$(docker ps --filter label=com.docker.compose.project=learninge --format '{{.Ports}}' | grep -oE '[^ ,]+->' | sort -u)
          test "$published" = "127.0.0.1:50051->" || { echo "$published"; exit 1; }
      - run: docker compose -f deploy/docker-compose.yml run --rm content --ops=import --dir=/content-data
      - name: Sao lưu tự động đã chạy, script theo dõi báo OK
        run: |
          docker compose -f deploy/docker-compose.yml exec -T auth sh -c 'ls /backup/auth-*.db'
          docker compose -f deploy/docker-compose.yml exec -T sync sh -c 'ls /backup/sync-*.db'
          CHECK_DISK_PERCENT=99 bash deploy/check.sh
      - name: Chế độ gộp sau Caddy, cùng dữ liệu
        env:
          EDGE_DOMAIN: api.learninge.test
          CADDY_TLS: tls internal
        run: |
          docker compose -f deploy/docker-compose.yml down
          docker compose -f deploy/docker-compose.small.yml -f deploy/docker-compose.tls.yml up --build -d --wait --wait-timeout 300
          code=$(curl -sk --http2 -o /dev/null -w '%{http_code} %{http_version}' --resolve api.learninge.test:443:127.0.0.1 https://api.learninge.test/)
          test "$code" = "415 2" || { echo "$code"; exit 1; }   # 415 là trả lời của gRPC khi gọi bằng HTTP thường
      - if: failure()
        run: docker ps -a && docker compose -f deploy/docker-compose.yml logs --tail 100

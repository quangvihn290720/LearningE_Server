spring:
  grpc:
    server:
      port: ${LISTEN_PORT:50052}

server:
  port: ${MANAGEMENT_PORT:8082}

learninge:
  services:
    sync: ${SYNC_ADDR:localhost:50053}
    gamification: ${GAMIFICATION_ADDR:localhost:50055}
    insight: ${INSIGHT_ADDR:localhost:50056}
  outbox:
    batch: ${OUTBOX_BATCH:200}
    max-backoff-secs: ${OUTBOX_MAX_BACKOFF_SECS:15}
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
  auth:
    db-path: ${AUTH_DB_PATH:./data/auth.db}
    server-key: ${LEARNINGE_SERVER_KEY:}
    pseudonym-key: ${LEARNINGE_PSEUDONYM_KEY:}
    token-ttl-days: ${TOKEN_TTL_DAYS:30}
    max-concurrent-hashes: ${PBKDF2_MAX_CONCURRENT:4}
